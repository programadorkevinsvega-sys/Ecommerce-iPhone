name: Storefront performance

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      perf_base_url:
        description: "Production base URL"
        required: false
        default: "https://iphone.jnmtortas.com"
        type: string

permissions:
  contents: read

env:
  PERF_BASE_URL: https://iphone.jnmtortas.com

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @ecommerce/web exec playwright install --with-deps chromium

      - name: Run production performance smoke
        shell: bash
        env:
          PERF_BASE_URL: ${{ inputs.perf_base_url || env.PERF_BASE_URL }}
        run: |
          set +e
          pnpm performance:production
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "::warning title=Performance monitor blocked by Cloudflare::The edge blocked one or more route probes. Performance timings are inconclusive and do not represent storefront performance."
            {
              echo "### Storefront performance measurement inconclusive"
              echo
              echo "Cloudflare blocked one or more GitHub Actions probes before the storefront could be measured. The script reported the Cloudflare response signature and Ray ID where available."
              echo "This run is not treated as a performance regression or a deployment failure; no performance pass is claimed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit "$status"
