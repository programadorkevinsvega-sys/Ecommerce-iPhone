name: Storefront performance

on:
  workflow_dispatch:
    inputs:
      perf_base_url:
        description: "Production base URL, for example https://ecommerce-iphone.example.com"
        required: true
        type: string

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @ecommerce/web exec playwright install --with-deps chromium
      - name: Run production performance smoke
        env:
          PERF_BASE_URL: ${{ inputs.perf_base_url }}
        run: pnpm performance:production
