name: Temporary single-file formatter

on:
  push:
    branches:
      - chore/production-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install formatting toolchain
        run: pnpm install --frozen-lockfile
      - name: Format and verify the remaining file
        shell: bash
        run: |
          set -euo pipefail
          file="modules/analytics/infrastructure/D1WebVitalsRepository.ts"
          pnpm exec prettier --write "$file"
          pnpm exec prettier --check "$file"
          if git diff --quiet -- "$file"; then
            echo "No format change was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$file"
          git commit -m "chore: format Web Vitals repository"
          git push origin "HEAD:${GITHUB_REF_NAME}"
