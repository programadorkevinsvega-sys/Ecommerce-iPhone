name: Production Worker Rollback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-rollback
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://iphone.jnmtortas.com

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Roll back Worker
        run: pnpm exec wrangler rollback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify production after rollback
        run: pnpm verify:production
        env:
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
