name: Production Verification

on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      run_deep_checks:
        description: "Run Phase 10.2–10.3 production probes (isolated analytics/catalog verification)"
        required: false
        default: false
        type: boolean
      run_admin_checks:
        description: "Verify the mandatory password-to-TOTP gate without storing a TOTP seed (requires admin credentials in GitHub Secrets)"
        required: false
        default: false
        type: boolean
      run_phase10_4_checks:
        description: "Run read-only Phase 10.4 production certification against real cart, checkout and payment events (requires production D1 read access)"
        required: false
        default: false
        type: boolean
      run_phase10_5_checks:
        description: "Run read-only Phase 10.5 payment ledger, refund, revenue and conversion reconciliation (requires real confirmed payment and refund history)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  checks: read

concurrency:
  # Serialize all production probes/certifications. Scheduled smoke checks are
  # read-only and use a separate lane from manual/deployment deep checks.
  group: production-verification-${{ github.event_name == 'schedule' && 'scheduled-smoke' || 'deep-production' }}
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://iphone.jnmtortas.com

jobs:
  # Credentialed manual checks can touch production D1 or admin sessions.
  # Fail closed when a workflow_dispatch originates from any branch but main.
  production_ref_guard:
    name: Guard credentialed production checks to main
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
        (inputs.run_deep_checks || inputs.run_admin_checks || inputs.run_phase10_4_checks || inputs.run_phase10_5_checks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require main branch for production credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Credentialed production checks are only allowed from refs/heads/main (requested: $GITHUB_REF)."
            exit 1
          fi
          echo "Production credential guard passed for $GITHUB_REF."

  smoke:
    # A check_run event is accepted only for the exact production Workers Build
    # check, created by Cloudflare's GitHub App, on main and with a successful
    # deployment conclusion. Scheduled/manual smoke monitoring remains intact.
    if: >-
      ${{ github.event_name != 'check_run' ||
        (github.event.check_run.name == 'Workers Builds: ecommerce-iphone' &&
         github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
         github.event.check_run.conclusion == 'success' &&
         github.event.check_run.check_suite.head_branch == 'main' &&
         contains(github.event.check_run.details_url, '/workers/services/view/ecommerce-iphone/production/builds/') &&
         !contains(github.event.check_run.details_url, '/previews/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      id-token: write
    outputs:
      production_health_verified: ${{ steps.production-health.outputs.production_health_verified }}
      production_monitor_url: ${{ steps.monitor-url.outputs.monitor_url }}
      public_edge_verified: ${{ steps.public-edge.outputs.public_edge_verified }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.check_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Resolve restricted Cloudflare workers.dev monitor host
        id: monitor-url
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_DEV_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}
        run: node scripts/resolve-workers-monitor-url.mjs

      - name: Verify authenticated Worker health and rate limiting
        id: production-health
        env:
          PRODUCTION_URL: ${{ steps.monitor-url.outputs.monitor_url }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-production.mjs
          echo "production_health_verified=true" >> "$GITHUB_OUTPUT"

      - name: Verify public edge health without bypassing Cloudflare
        id: public-edge
        env:
          PUBLIC_PRODUCTION_URL: https://iphone.jnmtortas.com
        run: node scripts/verify-production-edge.mjs

      - name: Verify Phase 08 public content and admin authorization
        env:
          PRODUCTION_URL: ${{ steps.monitor-url.outputs.monitor_url }}
        run: node scripts/verify-phase08-production.mjs

      - name: Verify Phase 09 SEO
        env:
          PRODUCTION_URL: ${{ steps.monitor-url.outputs.monitor_url }}
          PUBLIC_PRODUCTION_URL: https://iphone.jnmtortas.com
        run: node scripts/verify-phase09-production.mjs

      - name: Verify notification authorization boundaries
        env:
          PRODUCTION_URL: ${{ steps.monitor-url.outputs.monitor_url }}
        run: node scripts/verify-notifications-production.mjs

  # Manual engineering probes cover Phase 10.2–10.3. Analytics 10.4/10.5 are reserved for final manual review by the responsible QA area.
  deep-production:
    needs: [smoke, production_ref_guard]
    environment: production
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' &&
        inputs.run_deep_checks && github.ref == 'refs/heads/main' &&
        needs.production_ref_guard.result == 'success' &&
        needs.smoke.outputs.production_health_verified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCTION_URL: ${{ needs.smoke.outputs.production_monitor_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare D1 credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub Secret CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub Secret CLOUDFLARE_API_TOKEN."; exit 1; }
          echo "Cloudflare D1 verification credentials are available."

      - name: Verify Phase 10.2 analytics ingestion and idempotency
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm verify:phase10.2:production

      - name: Verify Phase 10.3 catalog and search analytics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm verify:phase10.3:production


  analytics-phase10-4-production:
    name: Analytics Phase 10.4 — read-only production certification
    needs: [smoke, production_ref_guard]
    environment: production
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' &&
        inputs.run_phase10_4_checks && github.ref == 'refs/heads/main' &&
        needs.production_ref_guard.result == 'success' &&
        needs.smoke.outputs.production_health_verified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCTION_URL: ${{ needs.smoke.outputs.production_monitor_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: pnpm install --frozen-lockfile

      - name: Verify read-only D1 credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub Secret CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub Secret CLOUDFLARE_API_TOKEN."; exit 1; }
          echo "Cloudflare D1 read credentials are available."

      - name: Verify Phase 10.4 real cart and checkout analytics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm verify:phase10.4:production

      - name: Record Phase 10.4 evidence and acceptance boundary
        if: always()
        run: |
          {
            echo "## Phase 10.4 production certification"
            echo
            echo "This job reads existing server-owned production events and canonical order/payment rows only."
            echo "It creates no carts, orders, payment intents, payments, refunds, analytics events or D1 mutations."
            echo "No missing production event class is replaced by synthetic data; insufficient real sample is INCONCLUSIVE."
          } >> "$GITHUB_STEP_SUMMARY"

  analytics-phase10-5-production:
    name: Analytics Phase 10.5 — read-only ledger and revenue reconciliation
    needs: [smoke, production_ref_guard]
    environment: production
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' &&
        inputs.run_phase10_5_checks && github.ref == 'refs/heads/main' &&
        needs.production_ref_guard.result == 'success' &&
        needs.smoke.outputs.production_health_verified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCTION_URL: ${{ needs.smoke.outputs.production_monitor_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: pnpm install --frozen-lockfile

      - name: Verify read-only D1 credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub Secret CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub Secret CLOUDFLARE_API_TOKEN."; exit 1; }
          echo "Cloudflare D1 read credentials are available."

      - name: Verify Phase 10.5 payment, refund and revenue reconciliation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm verify:phase10.5:production

      - name: Record Phase 10.5 evidence and acceptance boundary
        if: always()
        run: |
          {
            echo "## Phase 10.5 production certification"
            echo
            echo "This job reads the canonical payment ledger, payment/refund records and RevenueRecorded projections only."
            echo "It never creates charges, payment intents, refunds, ledger entries or D1 mutations."
            echo "A missing provider-confirmed real refund is INCONCLUSIVE; no refund is generated for certification."
          } >> "$GITHUB_STEP_SUMMARY"

  # These phases remain under responsible QA acceptance after their protected manual production checks are run. The checks are opt-in and read-only; final sign-off remains with QA.
  # manual acceptance after the complete system has been implemented.
  # This informational job never gates CI, deployment or pull-request merging.
  analytics-manual-review-pending:
    name: Analytics Phase 10.4/10.5 — PENDING MANUAL REVIEW
    if: >-
      ${{ github.event_name == 'check_run' &&
        github.event.check_run.name == 'Workers Builds: ecommerce-iphone' &&
        github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
        github.event.check_run.conclusion == 'success' &&
        github.event.check_run.check_suite.head_branch == 'main' &&
        contains(github.event.check_run.details_url, '/workers/services/view/ecommerce-iphone/production/builds/') &&
        !contains(github.event.check_run.details_url, '/previews/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record manual Analytics acceptance as pending
        env:
          DEPLOYED_SHA: ${{ github.event.check_run.head_sha }}
          DEPLOYED_CHECK_URL: ${{ github.event.check_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Analytics Phase 10.4/10.5 — PENDING MANUAL REVIEW"
            echo
            echo "- Deployed commit: $DEPLOYED_SHA"
            echo "- Cloudflare production build: $DEPLOYED_CHECK_URL"
            echo "- Phase 10.4 (cart, checkout and event integrity): **PENDING_MANUAL_REVIEW**"
            echo "- Phase 10.5 (payments, refunds and revenue reconciliation): **PENDING_MANUAL_REVIEW**"
            echo
            echo "These are final acceptance activities owned by the responsible QA/business area after the full system implementation is complete."
            echo "They do not run automatically on deploy and do not block engineering CI, deployment or pull-request integration. Start them only by selecting the Phase 10.4 and/or Phase 10.5 workflow_dispatch input on main after production smoke is green."
            echo "No production probes, synthetic payments or refunds are created by this job."
          } >> "$GITHUB_STEP_SUMMARY"

  admin-mfa-gate-production:
    needs: [smoke, production_ref_guard]
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' &&
        inputs.run_admin_checks && github.ref == 'refs/heads/main' &&
        needs.production_ref_guard.result == 'success' &&
        needs.smoke.outputs.production_health_verified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCTION_URL: ${{ needs.smoke.outputs.production_monitor_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Verify production password-to-TOTP challenge and session gate
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_RBAC_ALLOWED_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_RBAC_ALLOWED_PASSWORD }}
        run: node scripts/verify-admin-production.mjs
      - name: Record remaining manual MFA acceptance
        if: always()
        run: |
          {
            echo "## Admin MFA operational acceptance"
            echo
            echo "The automated smoke proves password-only login cannot create an admin session."
            echo "A human operator must still verify authenticator enrollment/login, single-use recovery codes, key rotation and privileged step-up with the real authenticator."
            echo "No TOTP seed or one-time code is stored in GitHub Actions."
          } >> "$GITHUB_STEP_SUMMARY"
