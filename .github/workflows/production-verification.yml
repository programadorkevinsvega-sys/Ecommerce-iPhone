name: Production Verification

on:
  workflow_dispatch:
    inputs:
      run_deep_checks:
        description: "Run Phase 10.2–10.5 production probes (writes unique probe data and cleans it up)"
        required: false
        default: false
        type: boolean
      run_admin_checks:
        description: "Run the authenticated production RBAC smoke test (requires admin credentials in GitHub Secrets)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: production-verification
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://iphone.jnmtortas.com

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cloudflare_edge_blocked: ${{ steps.production-health.outputs.cloudflare_edge_blocked }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production Worker health and rate limiting
        id: production-health
        shell: bash
        run: |
          set +e
          pnpm verify:production
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "cloudflare_edge_blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Production monitor blocked by Cloudflare::The edge returned a verified Cloudflare challenge/block response. Worker health is inconclusive; this is not reported as an application or deployment failure."
            {
              echo "### Production verification inconclusive"
              echo
              echo "Cloudflare blocked the GitHub Actions monitor before the health endpoint could be verified. The response diagnostics above include the Cloudflare Ray ID where available."
              echo "Phase 08, Phase 09 and notification HTTP probes are skipped for this run because they would use the same blocked public edge."
              echo
              echo "This does **not** certify production runtime health; check the Workers Builds deployment check and a real browser request separately."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          echo "cloudflare_edge_blocked=false" >> "$GITHUB_OUTPUT"

      - name: Verify Phase 08 public content and admin authorization
        if: steps.production-health.outputs.cloudflare_edge_blocked != 'true'
        run: pnpm verify:phase08:production

      - name: Verify Phase 09 SEO
        if: steps.production-health.outputs.cloudflare_edge_blocked != 'true'
        run: pnpm verify:phase09:production

      - name: Verify notification authorization boundaries
        if: steps.production-health.outputs.cloudflare_edge_blocked != 'true'
        run: pnpm verify:notifications:production

  deep-production:
    needs: smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deep_checks && needs.smoke.outputs.cloudflare_edge_blocked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Phase 10.2 analytics ingestion and idempotency
        run: pnpm verify:phase10.2:production

      - name: Verify Phase 10.3 catalog and search analytics
        run: pnpm verify:phase10.3:production

      - name: Verify Phase 10.4 cart, checkout and analytics
        run: pnpm verify:phase10.4:production

      - name: Verify Phase 10.5 canonical revenue projection
        run: pnpm verify:phase10.5:production

  admin-production:
    needs: smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_admin_checks && needs.smoke.outputs.cloudflare_edge_blocked != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_RBAC_ALLOWED_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_RBAC_ALLOWED_PASSWORD }}
      ADMIN_RBAC_DENIED_EMAIL: ${{ secrets.ADMIN_RBAC_DENIED_EMAIL }}
      ADMIN_RBAC_DENIED_PASSWORD: ${{ secrets.ADMIN_RBAC_DENIED_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production admin authentication, RBAC and session revocation
        run: pnpm verify:admin:production
