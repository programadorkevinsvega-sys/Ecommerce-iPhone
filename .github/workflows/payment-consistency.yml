name: Repository CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner-diagnostics:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Verify GitHub-hosted runner availability
        run: |
          echo "GitHub-hosted runner acquired successfully."
          node --version
          git --version

  payment-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify installation and Node.js toolchain
        run: node scripts/verify-install.mjs

      - name: Audit all dependencies
        run: pnpm audit

      - name: Check formatting of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm format:check:changed

      - name: Check repository foundations
        run: pnpm foundation:check

      - name: Check frontend production data
        run: pnpm frontend:data:check

      - name: Check architecture boundaries
        run: pnpm architecture:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run complete unit and integration test suite
        run: pnpm test

      - name: Prepare isolated local D1 database for E2E
        run: pnpm db:prepare:e2e

      - name: Build Cloudflare Worker with OpenNext
        run: pnpm cloudflare:build

      - name: Verify generated static pages and Worker bundle
        run: pnpm verify:cloudflare:build

      - name: Install Playwright Chromium
        run: pnpm --filter @ecommerce/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests against local Wrangler
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Verify production deployment guard for GitHub and Cloudflare branches
        shell: bash
        run: |
          set -euo pipefail

          if GITHUB_REF=refs/heads/feature/test node scripts/assert-main-deploy.mjs; then
            echo "::error::Production deployment guard unexpectedly allowed a non-main GitHub ref."
            exit 1
          fi

          if env -u GITHUB_REF WORKERS_CI_BRANCH=preview node scripts/assert-main-deploy.mjs; then
            echo "::error::Production deployment guard unexpectedly allowed a Cloudflare preview branch."
            exit 1
          fi

          env -u GITHUB_REF WORKERS_CI_BRANCH=main node scripts/assert-main-deploy.mjs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  ci-required:
    name: CI required
    if: ${{ always() }}
    needs:
      - runner-diagnostics
      - payment-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce all mandatory CI jobs
        env:
          RUNNER_DIAGNOSTICS_RESULT: ${{ needs.runner-diagnostics.result }}
          PAYMENT_QUALITY_RESULT: ${{ needs.payment-quality.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_DIAGNOSTICS_RESULT}" != "success" || "${PAYMENT_QUALITY_RESULT}" != "success" ]]; then
            echo "::error::Required CI gate failed or was skipped (runner-diagnostics=${RUNNER_DIAGNOSTICS_RESULT}, payment-quality=${PAYMENT_QUALITY_RESULT})."
            exit 1
          fi

          echo "All mandatory CI quality gates passed."
