name: Payment consistency

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-consistency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-diagnostics:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Verify GitHub-hosted runner availability
        run: |
          echo "GitHub-hosted runner acquired successfully."
          node --version
          git --version

  payment-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all dependencies (production, development, and optional)
        run: pnpm audit

      - name: Check formatting of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "${BASE_SHA}" ]]; then
            git diff --name-only "${BASE_SHA}...HEAD" > /tmp/changed-files
          else
            git diff --name-only HEAD^ HEAD > /tmp/changed-files
          fi

          mapfile -t changed_files < /tmp/changed-files
          if (( ${#changed_files[@]} > 0 )); then
            pnpm exec prettier --check --ignore-unknown "${changed_files[@]}"
          fi

      - name: Check repository foundations
        run: pnpm foundation:check

      - name: Check frontend production data
        run: pnpm frontend:data:check

      - name: Check architecture boundaries
        run: pnpm architecture:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run complete test suite
        run: pnpm test

      - name: Build Cloudflare application
        run: pnpm build:cloudflare
