name: Cloudflare Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

env:
  DB_NAME: ecommerce-iphone
  PRODUCTION_URL: https://iphone.jnmtortas.com
  PERF_BASE_URL: https://iphone.jnmtortas.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod

      - name: Foundation invariant check
        run: pnpm foundation:check

      - name: Frontend production-data check
        run: pnpm frontend:data:check

      - name: Architecture boundary check
        run: pnpm architecture:check

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build Cloudflare bundle
        run: pnpm build:cloudflare

      - name: Apply remote D1 migrations
        run: pnpm exec wrangler d1 migrations apply "$DB_NAME" --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker and assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify production health and protection
        run: pnpm verify:production
        env:
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}

      - name: Install Playwright browser
        run: pnpm --filter @ecommerce/web exec playwright install --with-deps chromium

      - name: Production performance gate
        run: pnpm performance:production
        env:
          PERF_BASE_URL: ${{ env.PERF_BASE_URL }}

      - name: Deployment gate passed
        run: echo "Production deploy, health verification, smoke checks and performance gate passed."
