name: Temporary PR formatter

on:
  push:
    branches:
      - chore/production-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install formatting toolchain
        run: pnpm install --frozen-lockfile
      - name: Format changed files and push a formatting-only commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base origin/main HEAD)"
          mapfile -d '' files < <(git diff -z --name-only --diff-filter=ACMR "${base}...HEAD")
          if (( ${#files[@]} == 0 )); then
            echo "No changed files to format."
            exit 0
          fi
          pnpm exec prettier --write --ignore-unknown "${files[@]}"
          pnpm exec prettier --check --ignore-unknown "${files[@]}"
          if git diff --quiet; then
            echo "All changed files already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "chore: format PR #26 changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
