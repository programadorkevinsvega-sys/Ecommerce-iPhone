name: Temporary PR 32 formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/phase-10-4-10-5-analytics-certification'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the existing PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier to the files reported by CI
        run: |
          pnpm exec prettier --write \
            apps/web/app/api/cart/route.ts \
            apps/web/app/cart/page.tsx \
            apps/web/app/checkout/page.tsx \
            apps/web/components/AddToCartButton.tsx \
            apps/web/lib/paymentAnalytics.ts \
            apps/web/lib/scheduledWorker.ts \
            docs/FASE-10-PRODUCTION-READINESS.md \
            docs/implementation/pr-plans/PR-10.4-10.5-analytics-certification.md \
            modules/analytics/application/RevenueAnalytics.test.ts \
            modules/analytics/application/RevenueAnalytics.ts \
            modules/analytics/infrastructure/D1AnalyticsRepository.test.ts \
            modules/analytics/infrastructure/D1AnalyticsRepository.ts \
            modules/analytics/infrastructure/D1RevenueAnalyticsRepository.test.ts \
            modules/analytics/infrastructure/D1RevenueAnalyticsRepository.ts \
            modules/cart/infrastructure/D1CartRepository.ts \
            modules/shared-kernel/testing/D1SqliteTestDatabase.ts \
            scripts/verify-phase10.4-production.mjs \
            scripts/verify-phase10.5-production.mjs

      - name: Remove the temporary formatter from the PR
        run: rm .github/workflows/temp-format-pr32.yml

      - name: Commit formatted files to the existing PR branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(analytics): apply repository Prettier to phase 10.4 and 10.5"
          git push origin "HEAD:refs/heads/${BRANCH}"
