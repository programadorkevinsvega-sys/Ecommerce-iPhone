name: Staging Validation

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Public staging Worker URL"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 35
    env:
      DB_NAME: ecommerce-iphone-staging
      STAGING_URL: ${{ inputs.staging_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Foundation invariant check
        run: pnpm foundation:check

      - name: Architecture boundary check
        run: pnpm architecture:check

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build Cloudflare bundle
        run: pnpm build:cloudflare

      - name: Verify staging D1 exists
        run: pnpm exec wrangler d1 list
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify staging R2 exists
        run: pnpm exec wrangler r2 bucket list
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify staging Queue exists
        run: pnpm exec wrangler queues list
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply staging migrations
        run: pnpm db:migrate:staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy staging Worker
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify staging runtime
        run: pnpm exec node scripts/verify-production.mjs
        env:
          PRODUCTION_URL: ${{ env.STAGING_URL }}
