name: Temporary PR 38 Prettier formatter

on:
  push:
    branches:
      - feat/phase10-4-10-5-readonly-certification
    paths:
      - ".github/workflows/pr38-temporary-prettier.yml"

permissions:
  contents: write

concurrency:
  group: pr38-temporary-prettier
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/feat/phase10-4-10-5-readonly-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/phase10-4-10-5-readonly-certification
          token: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            .github/workflows/production-verification.yml \
            apps/web/lib/githubActionsMonitorAccess.test.ts \
            docs/production-monitoring.md \
            scripts/resolve-workers-monitor-url.mjs \
            scripts/verify-phase10.4-production.mjs \
            scripts/verify-phase10.5-production.mjs

      - name: Upload formatted workflow source for reviewed API update
        uses: actions/upload-artifact@v7
        with:
          name: production-verification-prettier
          path: .github/workflows/production-verification.yml
          retention-days: 7

      - name: Commit non-workflow formatting on the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          format_files=(
            apps/web/lib/githubActionsMonitorAccess.test.ts
            docs/production-monitoring.md
            scripts/resolve-workers-monitor-url.mjs
            scripts/verify-phase10.4-production.mjs
            scripts/verify-phase10.5-production.mjs
          )
          if git diff --quiet -- "${format_files[@]}"; then
            echo "Prettier made no changes to the non-workflow files."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${format_files[@]}"
          git commit -m "chore(format): apply repository Prettier to Phase 10 certification"
          git push origin HEAD:refs/heads/feat/phase10-4-10-5-readonly-certification
